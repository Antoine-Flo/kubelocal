name: Release

on:
  push:
    tags:
      - "v*" # Déclenche sur les tags qui commencent par 'v'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Nécessaire pour créer des releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version: "1.25.1" # Ajuste selon ta version

      - name: Build binary
        run: |
          go build -o kubelocal-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2.3.4
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: kubelocal-linux-amd64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
